# Register of authorised incompatible changes for the 0.22 migration.
#
# The manifests stay at 0.21.3 and nothing is published while the migration
# runs, so `cargo semver-checks` compares against the published 0.21.3 and
# reports every removal. This file is the only place where such a report is
# allowed to be expected rather than a failure, and every entry is authorised
# by the repository owner on the register tracking issue before it may land.
#
# Schema and verdicts: `scripts/check_accepted_breaks.py` (module docstring).
# Nothing here is approved by the file itself; see `status` and `approval`.

[register]
# The comparison baselines. `initial_reference` is used by C2 until the first
# commit carrying an `Accepted-Breaks:` trailer exists on `main`.
published = "0.21.3"
initial_reference = "v0.21.3"
# The login whose comment on `issue` may set `status = "approved"`.
owner = "joaquinbejar"
repo = "joaquinbejar/OptionStratLib"
issue = 592
# The report grammar changes between releases; the parser is written against
# this exact version and refuses any other.
tool = "cargo-semver-checks 0.50.0"

# Surfaces every comparison runs on. `default` is spelled out rather than
# taken from the manifest, so a change to the default feature set is visible
# here as a diff instead of silently moving the surface.
#
# `repo` is only used to read approval comments (`--verify-approvals`).
# Every surface but `all` is built with `--only-explicit-features`, so
# `features` is the complete list asked for; Cargo still pulls in whatever
# those features imply (`static_export` implies `plotly` and `async`).
[[register.surfaces]]
id = "none"
features = []

[[register.surfaces]]
id = "default"
features = ["synthetic"]

[[register.surfaces]]
id = "plotly"
features = ["plotly"]

[[register.surfaces]]
id = "static_export"
features = ["static_export"]

[[register.surfaces]]
id = "async"
features = ["async"]

[[register.surfaces]]
id = "all"
all_features = true

# No break is authorised yet. An entry looks like this (see the docstring):
#
# [[break]]
# id = "AB-01"
# surfaces = ["none", "default", "plotly", "static_export", "async", "all"]
# baseline = ["0.21.3", "reference", "incremental"]
# findings = [
#   { check = "C1", lint = "function_missing", item = "function optionstratlib::utils::logger::setup_logger" },
#   { check = "C2", lint = "function_missing", item = "function optionstratlib::utils::logger::setup_logger" },
#   { check = "C3", lint = "function_missing", item = "function optionstratlib::utils::logger::setup_logger" },
# ]
# decision = "M1-EXIT-PROPOSAL D4"
# issue = 506
# migration = "call tracing_subscriber::fmt().with_max_level(..).init() from the binary"
# status = "proposed"
# approval = { ref = "", date = "" }
# landed = { pr = 0 }

# --- Findings of the gate's first run, recorded, NOT approved ------------
#
# `synthetic` (#512, merged as #578) gates the simulation-backed chain and
# series generators. It is on by default, so the default surface is
# unchanged, but a consumer building with `default-features = false` had
# these functions in 0.21.3 and does not have them now. C1 reports it on
# every surface that does not enable `synthetic`.
#
# This is a real incompatibility that landed before the register existed,
# and only the repository owner can authorise it, on issue #592. Until then
# the entries stay `proposed`, the accepted-breaks job reports them, and its
# result does not block: see the `continue-on-error` note in
# `.github/workflows/accepted_breaks.yml`.
#
# The alternative to approving is to make the generators available without
# the feature again, which undoes part of #512.

[[break]]
id = "AB-01"
surfaces = ["none", "plotly", "async"]
baseline = ["0.21.3"]
findings = [
  { check = "C1", lint = "function_missing", item = "function optionstratlib::chains::generator_positive" },
  { check = "C1", lint = "function_missing", item = "function optionstratlib::chains::generator_optionchain" },
  { check = "C1", lint = "function_missing", item = "function optionstratlib::series::generator_optionseries" },
  { check = "C1", lint = "function_missing", item = "function optionstratlib::prelude::generator_optionchain" },
  { check = "C1", lint = "function_missing", item = "function optionstratlib::prelude::generator_optionseries" },
]
decision = "pending owner decision on #592"
issue = 512
migration = "enable the `synthetic` feature, which is on by default; a build with `default-features = false` must list it explicitly"
status = "proposed"
approval = { ref = "", date = "" }
landed = { pr = 578 }
