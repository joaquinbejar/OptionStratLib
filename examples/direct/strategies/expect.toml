# The resolved normal graph of `osl-example-direct-strategies`: packages it must
# contain and packages it must not, checked by `make check-fixtures`
# (scripts/check_fixtures.py) and, for one example, by
# `make tree-example-direct-strategies`. The example is a workspace member, and
# `cargo tree` on its manifest resolves that package alone, so what the other
# members enable cannot widen the graph. `tracing-subscriber` is in the tree
# on purpose: the example installs it as its application logger, and no
# component crate resolves it.
present = [
    "optionstratlib-core", "optionstratlib-math", "optionstratlib-pricing",
    "optionstratlib-market", "optionstratlib-analytics",
    "optionstratlib-strategies",
]
absent = [
    "optionstratlib", "optionstratlib-simulation", "optionstratlib-backtest",
    "optionstratlib-visualization", "csv", "zip", "tokio", "reqwest",
    "futures", "async-trait", "plotly_static", "fantoccini", "webdriver",
    "indicatif", "utoipa", "plotly", "prettytable-rs",
]
