# Direct-component example: an option chain and series from optionstratlib-market with no features.
# Layout and naming follow ADR-0004 section 8: `examples/direct/<scenario>/`,
# package `osl-example-direct-<scenario>`, a workspace member, `publish = false`.
#
# The manifest is self-contained: every dependency has an explicit version and
# nothing is inherited from the workspace, so you can copy it into your own
# project. The OptionStratLib crates are declared by path plus version, as
# every one is until the crates are published (ADR-0001 D1); in your project
# keep the version and drop the path. `make tree-example-direct-market`
# asserts the resolved graph from `expect.toml`, and
# `make check-direct-examples-packaged` builds a copy of this example against
# the packaged component crates.
[package]
name = "osl-example-direct-market"
version = "0.1.0"
edition = "2024"
publish = false
description = "Direct-component example: an option chain and series from optionstratlib-market with no features."

[dependencies]
optionstratlib-core = { path = "../../../crates/optionstratlib-core", version = "0.22.0" }
optionstratlib-market = { path = "../../../crates/optionstratlib-market", version = "0.22.0" }
serde_json = "1.0"
rust_decimal = "1.43"
rust_decimal_macros = "1.40"
tracing = "0.1"
tracing-subscriber = "0.3"

# The same program on the facade would declare this instead (one dependency,
# but every default capability resolves unless you opt out; the paths in the
# source then read `optionstratlib::...`):
#
#   optionstratlib = { version = "0.22", default-features = false, features = ["market"] }
