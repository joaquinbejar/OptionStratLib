# Prototype for #920: native PNG/SVG export with Plotters, compared with the
# current Plotly export (`plotly_static` + chromedriver + headless Chrome).
#
# A workspace member with `publish = false`. It is an experiment, not part of
# any published crate: nothing here changes `optionstratlib-visualization`,
# its features or the facade. The native renderer reads the same backend-
# neutral `GraphData` / `GraphConfig` the Plotly path reads, so the two
# outputs come from identical inputs. See `REPORT.md` for the results.
#
# The Plotly baseline was behind a `plotly-baseline` feature that turned on
# `optionstratlib-visualization/static_export`, then the `plotly_static`
# browser export. Since #927 that feature draws natively, so the baseline is
# reproducible only at 8484b42f, the last commit with the browser export;
# `compare` refuses the `plotly` backend here.
[package]
name = "osl-prototype-plotters-export"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype for #920: native PNG/SVG export with Plotters, compared with the Plotly static export (baseline retired in #927)."

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-pricing = { workspace = true }
optionstratlib-strategies = { workspace = true }
optionstratlib-visualization = { workspace = true }
# Only the pieces the prototype draws with, and no font feature: neither
# `ab_glyph` nor `ttf` (font-kit, fontconfig), so no ttf-parser
# (RUSTSEC-2026-0192). The prototype measures and draws every label itself
# (`src/text.rs`, `src/backend.rs`).
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "colormaps",
    # `colormaps` does not compile without it in 0.3.7.
    "full_palette",
    "line_series",
    "svg_backend",
] }
# The backend trait and text style types the text backend implements;
# already in the tree through plotters.
plotters-backend = "0.3.7"
base64 = "0.22"
# The bundled font's character map, advances, metrics and glyph outlines.
# skrifa (Google Fonts' fontations) is the replacement the ttf-parser
# advisory names.
skrifa = { version = "0.48", default-features = false, features = ["std"] }
# Antialiased coverage of the glyph outlines for PNG text; no font parsing.
ab_glyph_rasterizer = "0.1.10"
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
# Decodes the PNGs in the tests; already in the tree through plotters.
png = "0.17.16"

[[bench]]
name = "native_export"
harness = false
