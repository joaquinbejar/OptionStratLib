# Accepted-breaks gate (#592).
#
# Three comparisons per feature surface, all against `public-api/accepted-breaks.toml`:
#
#   C1 cumulative    baseline = the published 0.21.3
#   C2 reference     baseline = the newest `Accepted-Breaks:` commit BEFORE the
#                    change under test (never the commit itself)
#   C3 incremental   baseline = the first parent of the merge commit CI checks
#                    out, which is the pull request's base
#
# The job is informational until its implementation has been reviewed: it is
# not a required check and it does not replace the `semver` job, which keeps
# running unchanged.
name: ACCEPTED BREAKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  # Pinned: the parser is written against this report grammar and refuses any
  # other version (the register records it too).
  SEMVER_CHECKS_VERSION: 0.50.0

jobs:
  accepted-breaks:
    name: accepted-breaks (${{ matrix.surface }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # The job reports, it does not block, while the register still holds a
    # `proposed` entry. Its first run found a real incompatibility that
    # landed before the register existed (the `synthetic` gate of #512
    # removes the chain and series generators from every surface that does
    # not enable the feature), and only the repository owner can authorise
    # it on #592. Turning this to a required check is the step that follows
    # that decision, not something this pull request may do for itself.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Every surface on every pull request: a change can leave the default
        # surface and stay behind a feature, which `--all-features` cannot see.
        surface: [none, default, plotly, static_export, async, all]
    steps:
      - uses: actions/checkout@v4
        with:
          # C2 walks the history for the trailer and C3 needs the merge
          # commit's parents.
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make libfontconfig1-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Up to six rustdoc builds per surface (current tree plus the three
          # baselines, which cargo-semver-checks caches per revision).
          key: accepted-breaks-${{ matrix.surface }}
      - name: Install cargo-semver-checks ${{ env.SEMVER_CHECKS_VERSION }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.SEMVER_CHECKS_VERSION }}
      - uses: actions/setup-python@v5
        with:
          # `tomllib`, used to read the register.
          python-version: '3.12'
      - name: Parser self-test and register rules
        run: python3 scripts/check_accepted_breaks.py --self-test
      - name: Verify every approval comment
        run: python3 scripts/check_accepted_breaks.py --verify-approvals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve baselines
        id: bases
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            echo "pin=--base-sha $base --head-sha $head --pr ${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "incremental=$base" >> "$GITHUB_OUTPUT"
            before="$base"
            against="$base"
            against_flag="--against $against"
            c2_enabled="true"
            c3_enabled="true"
            echo "landed_only=" >> "$GITHUB_OUTPUT"
          else
            echo "pin=" >> "$GITHUB_OUTPUT"
            parent="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [ -z "$parent" ]; then
              parent=""
              before="$(git rev-parse HEAD)"
              against_flag=""
              c2_enabled="false"
              c3_enabled="false"
            else
              against_flag="--against $parent"
              before="$parent"
              c2_enabled="true"
              c3_enabled="true"
            fi
            echo "incremental=$parent" >> "$GITHUB_OUTPUT"
            echo "landed_only=--landed-only" >> "$GITHUB_OUTPUT"
          fi
          # The reference itself is resolved by the script, which owns the
          # rule and the register's `initial_reference`; the workflow only
          # says which state precedes the change under test.
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "against_flag=$against_flag" >> "$GITHUB_OUTPUT"
          echo "c2_enabled=$c2_enabled" >> "$GITHUB_OUTPUT"
          echo "c3_enabled=$c3_enabled" >> "$GITHUB_OUTPUT"
          echo "before=$before"
      - name: C1 cumulative against the published 0.21.3
        run: python3 scripts/check_accepted_breaks.py --check C1 --surface ${{ matrix.surface }} ${{ steps.bases.outputs.against_flag }} ${{ steps.bases.outputs.pin }} ${{ steps.bases.outputs.landed_only }}
      - name: C2 against the controlled reference
        if: ${{ steps.bases.outputs.c2_enabled == 'true' }}
        run: python3 scripts/check_accepted_breaks.py --check C2 --surface ${{ matrix.surface }} --before ${{ steps.bases.outputs.before }} ${{ steps.bases.outputs.against_flag }} ${{ steps.bases.outputs.pin }} ${{ steps.bases.outputs.landed_only }}
      - name: C3 incremental against the pull request base
        if: ${{ steps.bases.outputs.c3_enabled == 'true' }}
        run: python3 scripts/check_accepted_breaks.py --check C3 --surface ${{ matrix.surface }} --baseline ${{ steps.bases.outputs.incremental }} ${{ steps.bases.outputs.against_flag }} ${{ steps.bases.outputs.pin }} ${{ steps.bases.outputs.landed_only }}
