name: Examples and benches

# Every example binary and every Criterion bench builds and runs once (#787),
# so neither rots unnoticed. The examples' PNG/SVG exports are native since
# #927, so every program runs to the end with its real exports and any
# failure, an export error included, fails the job (#929): this replaced the
# weekly `static_export.yml` browser run.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  examples:
    name: Run every example
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-examples-

      # No fontconfig or font package: the examples' exports read the font
      # the visualization crate bundles (#927).
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make build-essential

      - name: Build and run every example
        run: make smoke-examples

  benches:
    name: Run every bench
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-benches-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-benches-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make libfontconfig1-dev pkg-config build-essential

      - name: Compile and run every bench once
        run: make smoke-benches
