name: Visualization surfaces

# The compilation surfaces of the visualization layer, one job each (#547,
# ADR-0004 sections 1 and 2): backend-neutral (no feature), `plotly` and
# `static_export`. An all-features run never compiles the backend-neutral
# `Graph` and cannot show that the headless surfaces stay free of Plotly and
# the export stack, so each surface runs on its own, for the direct
# `optionstratlib-visualization` crate and for the facade feature that routes
# to it: check, Clippy, tests and doctests, docs with warnings denied, the
# consumer fixtures of the surface and the dependency assertions. The
# `#[ignore]`d PNG/SVG export tests need a browser and run from
# `static_export.yml` on a schedule. The recipe is
# `make check-visualization-surface`, so the same command runs locally.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  surface:
    name: Visualization (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        surface:
          - neutral
          - plotly
          - static_export

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-visualization-${{ matrix.surface }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-visualization-${{ matrix.surface }}-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make libfontconfig1-dev pkg-config

      # Consumer fixtures build from a target dir of their own, so a cached
      # workspace target cannot hide a missing dependency (#527).
      - name: Check, test, document and assert the ${{ matrix.surface }} surface
        run: |
          rm -rf target/fixtures
          make check-visualization-surface SURFACE=${{ matrix.surface }}
