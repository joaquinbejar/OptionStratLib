name: Components

# Standalone verification of each extracted workspace crate (#519): the
# crate's own tests with default, no and all features, Clippy, docs with
# broken links and missing docs denied, and its packaged archive. The facade
# is not part of these builds, so a test that only compiles because the
# facade is present fails here.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  components:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-components-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-components-

      - name: Install make
        run: sudo apt-get install -y make

      - name: Verify component crates standalone
        run: make check-components

      # The direct-component examples built outside the repository against the
      # packaged crates (#555). `check-components` leaves no facade archive, so
      # this step packages all ten crates (the facade and the nine components)
      # again; OSL_REUSE_PACKAGES=1 keeps those for the consumer step below.
      - name: Direct-component examples against the packaged crates
        run: OSL_REUSE_PACKAGES=1 make check-direct-examples-packaged

      # The ten published packages: contents and metadata, then a build, the
      # docs and the doc tests from the unpacked archives, reusing the ones
      # the step above packaged, and a check with the declared rust-version
      # (#559).
      - name: Package contents, metadata and unpacked archives
        run: |
          rustup toolchain install 1.89 --profile minimal
          make check-packages
          OSL_REUSE_PACKAGES=1 make check-package-archives

      # Every manifest-plus-program pair of the 0.22 release notes, built as a
      # standalone crate outside the repository against this checkout; it
      # resolves the crates.io index, so it needs network access (#562, #557).
      - name: Release-notes examples
        run: make check-release-notes

      # Cross-component regressions, against the components only (#534).
      - name: Workspace integration tests
        run: make test-workspace-integration

      # The 0.22 consumers build from a fresh target dir of their own each,
      # so the cached workspace target cannot hide a missing dependency
      # (#527); every fixture under fixtures/consumers/ is asserted, linted,
      # tested, and tested again against the packaged crates, reusing the ten
      # archives the direct-examples step packaged (#552).
      - name: 0.22 consumer fixtures
        run: |
          rm -rf target/fixtures
          OSL_REUSE_PACKAGES=1 make test-022-consumers

      # Direct-component examples: lint, test, run and assert the resolved
      # graph of each (#555).
      - name: Direct-component examples
        run: |
          make test-direct-component-examples
          make tree-example-direct-pricing
          make tree-example-direct-simulation
          make tree-example-direct-visualization
