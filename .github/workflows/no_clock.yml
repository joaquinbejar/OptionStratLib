name: No clock

# The library with the `clock` feature off (#944): `cargo tree -e features -i
# chrono` shows no `clock` for any published crate or facade combination, and
# those configurations lint, build and test. The trees run first and fail fast
# with the path that turned the clock on.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  no-clock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-no-clock-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-no-clock-

      - name: Install make
        run: sudo apt-get install -y make

      - name: Dependency trees without the clock
        run: make check-no-clock-trees

      - name: Lint, build and test without the clock
        run: make check-no-clock
