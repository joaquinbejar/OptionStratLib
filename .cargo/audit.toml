# cargo-audit configuration for the `optionstratlib` crate.
#
# See https://docs.rs/cargo-audit for the full schema.

[advisories]
# Advisories deliberately ignored, each with reachability rationale, owner and
# review date. Every entry MUST be re-evaluated on or before its review date;
# an entry whose upstream fix has shipped must be removed, not extended.
#
# ---------------------------------------------------------------------------
# RUSTSEC-2026-0235 — rkyv 0.7.46, out-of-bounds read validating archives that
#                     contain Rc/Arc. Fixed in rkyv >= 0.8.17.
#
# Reachability : NOT REACHABLE. `rkyv` enters Cargo.lock only as an *optional*
#                dependency of `rust_decimal`. This crate depends on
#                rust_decimal with `features = ["maths", "serde"]` and never
#                enables its `rkyv` feature, so the crate is never compiled or
#                linked. Verified with:
#                    cargo tree --all-features --target all -i rkyv
#                which reports "nothing to print" — no path from
#                `optionstratlib` to `rkyv` exists under any feature or target
#                combination. Cargo records optional dependencies in the
#                lockfile regardless of feature selection, which is why
#                `cargo audit` still sees it.
# Upgrade path : Blocked upstream. rust_decimal 1.42.1 (the latest release)
#                pins the 0.7 line for its optional `rkyv` feature; moving to
#                rkyv 0.8 is a breaking change that must land in rust_decimal
#                first. There is no version of rust_decimal we can select that
#                resolves this.
# Tracking     : https://github.com/paupino/rust-decimal/issues
# Owner        : @joaquinbejar
# Review by    : 2027-02-15
# ---------------------------------------------------------------------------
# RUSTSEC-2025-0119 — number_prefix 0.4.0, unmaintained.
#
# Reachability : NOT REACHABLE. Lockfile-only, exactly like the rkyv entry
#                above: `cargo tree --all-features --target all -i
#                number_prefix` reports that the package is not in the graph
#                at all. It is recorded as an optional dependency of
#                `indicatif`, whose feature this crate does not enable.
# Upgrade path : None to take — an unmaintained advisory has no fixed release.
#                It would disappear on its own once `indicatif` drops the
#                dependency.
# Tracking     : https://github.com/console-rs/indicatif
# Owner        : @joaquinbejar
# Review by    : 2027-02-15
# ---------------------------------------------------------------------------
# RUSTSEC-2025-0134 — rustls-pemfile 1.0.4, unmaintained.
#
# Reachability : NOT LINKED INTO THIS CRATE. It arrives through
#                `reqwest 0.11`, which is a *build*-dependency of
#                `plotly_static` (via `webdriver-downloader`), itself pulled in
#                only by the `static_export` feature:
#                    optionstratlib -> plotly -> plotly_static
#                      -> [build-dependencies] webdriver-downloader
#                      -> reqwest 0.11 -> rustls-pemfile 1.0.4
#                It runs on the build machine while downloading a webdriver, is
#                absent from the library and from every default-feature build,
#                and never parses attacker-supplied PEM at runtime.
# Upgrade path : Blocked upstream: it needs `plotly_static` to move off
#                `reqwest` 0.11, which is the crate that pins the old
#                `rustls-pemfile` line.
# Tracking     : https://github.com/plotly/plotly.rs
# Owner        : @joaquinbejar
# Review by    : 2027-02-15
# ---------------------------------------------------------------------------
# RUSTSEC-2026-0258 — h2 0.3.27, unbounded empty DATA frames. A hostile HTTP/2
#                     peer can keep a connection busy with empty DATA frames.
#                     Fixed in h2 >= 0.4.16.
#
# Reachability : NOT LINKED INTO THIS CRATE, and not present at all in a
#                default-feature build. `cargo tree -i h2@0.3.27` reports the
#                package is not in the graph; it appears only under
#                `--all-features`, on the same build-machine path as the
#                `rustls-pemfile` entry above:
#                    optionstratlib -> plotly -> plotly_static
#                      -> [build-dependencies] webdriver-downloader
#                      -> fantoccini / reqwest 0.11 -> hyper 0.14 -> h2 0.3.27
#                It is the HTTP/2 client used to download a webdriver while
#                building with `static_export`, talking to a known release
#                endpoint. It never serves connections, never faces an
#                untrusted peer, and is absent from the shipped library.
# Upgrade path : Blocked upstream. The fix is in the 0.4 line, so escaping it
#                requires `plotly_static` to move off `reqwest` 0.11 /
#                `hyper` 0.14; there is no h2 0.3.x release that resolves it.
#                Note this crate ships no Cargo.lock, so a fresh resolution
#                already selects a fixed h2 for the 0.4 copy in the graph
#                (0.4.19 at the time of writing, above the 0.4.16 fix). Only
#                the build-time 0.3 copy, which cannot move, is waived here —
#                if the 0.4 copy ever regresses below 0.4.16 this entry would
#                hide it, since cargo-audit ignores by advisory ID and not by
#                version.
# Tracking     : https://github.com/plotly/plotly.rs
# Owner        : @joaquinbejar
# Review by    : 2026-11-28
# ---------------------------------------------------------------------------
ignore = [
    "RUSTSEC-2026-0235",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0258",
]

# Every other advisory class fails the run, so a new unmaintained or unsound
# dependency cannot slip in as a silent warning: with these three waived, the
# audit is expected to be clean, and `denyWarnings` in the workflow can be
# turned on without turning the gate into noise.
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "none"
