[package]
name = "optionstratlib"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "OptionStratLib is a comprehensive Rust library for options trading and strategy development across multiple asset classes."
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["finance", "options", "trading"]
categories = ["finance", "data-structures"]
include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "Docker/**/*.Dockerfile",
    "Docker/**/*.yml",
]


[features]
# Facade capabilities (ADR-0002 Decision 2). Each one adds the component
# crate it names and the facade paths over it; none replaces a type. The
# default enables every capability that exists today, so the default surface
# is the whole library.
default = ["pricing", "market", "analytics", "strategies", "simulation", "synthetic", "io"]
# `curves`, `surfaces`, `geometrics` and the math errors.
math = ["dep:optionstratlib-math"]
# `pricing`, `greeks`, `volatility` and the pricing errors. Resolves no market,
# I/O, async or visualization package.
pricing = ["dep:optionstratlib-pricing", "math"]
# `chains`, `series` and the market errors, without I/O (`io`) or the
# simulation-backed generators (`synthetic`).
market = ["dep:optionstratlib-market", "pricing"]
# `analytics`, `pnl`, `risk`, `metrics` and the analytics errors: P&L, margin,
# probability kernels, chain metrics and projections, without strategies,
# simulation or plotting.
analytics = ["dep:optionstratlib-analytics", "market"]
# `strategies` and `StrategyError`: the concrete strategies, the strategy
# traits, delta neutrality and strategy probability analysis, without
# simulation, backtesting or plotting.
strategies = ["dep:optionstratlib-strategies", "analytics"]
# `simulation` and `SimulationError`: random walks, stochastic processes,
# simulators, exit policies and path statistics, without option chains,
# strategies, backtesting or plotting. It implies only `pricing`, so
# `market`, `analytics` or `strategies` alone resolves no simulation crate.
simulation = ["dep:optionstratlib-simulation", "pricing"]
# `synthetic`: the simulation-backed chain and series generators
# (`chains::generator_optionchain`, `series::generator_optionseries`). It
# forwards to `optionstratlib-market/synthetic`, the only market-to-simulation
# dependency (ADR-0003).
synthetic = ["market", "simulation", "optionstratlib-market/synthetic"]
# Filesystem I/O for market data: CSV, JSON and ZIP readers and writers of
# chains and OHLCV candles (ADR-0003). On by default; without it the build
# resolves no `csv` or `zip`.
io = ["market", "optionstratlib-market/io"]
# Charts over the whole library: `visualization` renders strategies, chains
# and simulations, so it needs every capability below it.
plotly = ["dep:plotly", "strategies", "simulation"]
static_export = [
    "plotly",
    "async",
]
async = [
    "market",
    "io",
    "dep:tokio",
    "dep:async-trait",
    "dep:reqwest",
    "dep:futures",
    "optionstratlib-market/async",
]

[dependencies]
optionstratlib-core = { workspace = true, features = ["schema"] }
optionstratlib-math = { workspace = true, optional = true, features = ["schema"] }
optionstratlib-pricing = { workspace = true, optional = true, features = ["schema"] }
optionstratlib-simulation = { workspace = true, optional = true, features = ["schema"] }
optionstratlib-market = { workspace = true, optional = true, features = ["schema"] }
optionstratlib-analytics = { workspace = true, optional = true, features = ["schema"] }
optionstratlib-strategies = { workspace = true, optional = true, features = ["schema"] }
chrono = { workspace = true, features = ["serde"] }
approx = { workspace = true }
plotly = { workspace = true, default-features = false, optional = true, features = ["static_export_default"] }
statrs = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
tracing = { workspace = true }
num-traits = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rayon = { workspace = true }
rust_decimal = { workspace = true,  features = ["maths", "serde"] }
rust_decimal_macros = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
prettytable-rs = { workspace = true, features = ["win_crlf"] }
pretty-simple-display = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
indicatif = { workspace = true }
thiserror = { workspace = true }
positive = { workspace = true }
expiration_date = { workspace = true }
financial_types = { workspace = true }
option_type = { workspace = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures = { workspace = true, optional = true }


[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
mockall = { workspace = true }
tempfile = { workspace = true }
static_assertions = "1.1"
proptest = { workspace = true }

[[test]]
name = "tests"
path = "tests/unit/mod.rs"
required-features = ["strategies", "simulation"]

[[test]]
name = "property_tests"
path = "tests/property/mod.rs"
required-features = ["strategies", "simulation"]

[[bench]]
name = "benches"
path = "benches/mod.rs"
harness = false
required-features = ["strategies", "simulation"]

[lib]
name = "optionstratlib"
path = "src/lib.rs"
crate-type = ["rlib"]

[workspace]
# Consumer fixtures resolve on their own (ADR-0004 section 3).
exclude = [
    "fixtures/consumers/analytics-only",
    "fixtures/consumers/facade-analytics",
    "fixtures/consumers/facade-market",
    "fixtures/consumers/facade-pricing",
    "fixtures/consumers/facade-strategies",
    "fixtures/consumers/market-minimal",
    "fixtures/consumers/market-synthetic",
    "fixtures/consumers/pricing-only",
]
members = [
    "crates/optionstratlib-core",
    "crates/optionstratlib-math",
    "crates/optionstratlib-pricing",
    "crates/optionstratlib-simulation",
    "crates/optionstratlib-market",
    "crates/optionstratlib-analytics",
    "crates/optionstratlib-strategies",
    "tests/workspace",
    "examples/support",
    "examples/examples_chain",
    "examples/examples_curves",
    "examples/examples_exotics",
    "examples/examples_metrics",
    "examples/examples_pricing",
    "examples/examples_simulation",
    "examples/examples_strategies",
    "examples/examples_strategies_best",
    "examples/examples_strategies_delta",
    "examples/examples_surfaces",
    "examples/examples_visualization",
    "examples/examples_volatility",
]

[workspace.package]
# Lockstep version shared by every published workspace crate (ADR-0001 D1).
version = "0.22.0"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/OptionStratLib"
homepage = "https://github.com/joaquinbejar/OptionStratLib"

[workspace.dependencies]
# Inter-crate dependencies: path for the workspace, version for crates.io
# (ADR-0001 D1, caret requirement on the lockstep version).
optionstratlib = { path = ".", version = "0.22.0" }
optionstratlib-core = { path = "crates/optionstratlib-core", version = "0.22.0" }
optionstratlib-math = { path = "crates/optionstratlib-math", version = "0.22.0" }
optionstratlib-pricing = { path = "crates/optionstratlib-pricing", version = "0.22.0" }
optionstratlib-simulation = { path = "crates/optionstratlib-simulation", version = "0.22.0" }
optionstratlib-market = { path = "crates/optionstratlib-market", version = "0.22.0" }
optionstratlib-analytics = { path = "crates/optionstratlib-analytics", version = "0.22.0" }
optionstratlib-strategies = { path = "crates/optionstratlib-strategies", version = "0.22.0" }
tracing = "0.1"
rust_decimal = { version = "1.43", features = ["maths", "serde"] }
rust_decimal_macros = "1.40"
plotly = { version = "0.14", default-features = false, features = ["static_export_default"] }
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.10" }
statrs = "0.19"
tracing-subscriber = { version = "0.3"}
num-traits = "0.2"
serde_json = "1.0"
csv = { version = "1.4"}
serde = { version = "1.0", features = ["derive"] }
rayon = { version = "1.12" }
itertools = "0.15"
zip = "8.6"
lazy_static = "1.5"
uuid = { version = "1.27", features = ["v4", "serde"] }
approx = "0.5"
rand_distr = "0.6"
# Defaults off: nothing here uses its CSV support, and it would pull `csv`
# into every consumer. Packages that want `win_crlf` ask for it.
prettytable-rs = { version = "0.10", default-features = false }
pretty-simple-display = "0.1"
utoipa = { version = "6.0", features = ["chrono", "decimal"] }
indicatif = "0.18"
thiserror = "2.0"
positive = { version = "0.7" }
expiration_date = { version = "0.4" }
financial_types = { version = "0.3" }
option_type = { version = "0.4" }
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
futures = "0.3"
proptest = "1.11"
mockall = "0.15"
tempfile = "3.27"
