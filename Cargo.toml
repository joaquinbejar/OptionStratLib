[package]
name = "optionstratlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "OptionStratLib facade: option pricing, Greeks, option chains, P&L, risk, strategies, simulation, backtesting and charts for trading and strategy development, re-exported from its nine component crates with one feature per capability."
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["finance", "options", "trading"]
categories = ["finance", "data-structures"]
# The library source, the documents its rustdoc includes, and the package
# metadata, anchored at the package root so a README or manifest elsewhere in
# the tree is not swept in. Tests, benches, examples and local tooling stay in
# the repository (#559).
include = [
    "/src/**/*",
    "/docs/*.md",
    "/docs/release/0.22/RELEASE-NOTES.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[features]
# Facade capabilities (ADR-0002 Decision 2). Each one adds the component
# crate it names and the facade paths over it; none replaces a type. The
# default enables every capability that exists today, so the default surface
# is the whole library.
default = ["pricing", "market", "analytics", "strategies", "simulation", "backtest", "visualization", "synthetic", "io", "schema"]
# `curves`, `surfaces`, `geometrics` and the math errors.
math = ["dep:optionstratlib-math"]
# `pricing`, `greeks`, `volatility` and the pricing errors. Resolves no market,
# I/O, async or visualization package.
pricing = ["dep:optionstratlib-pricing", "math"]
# `chains`, `series` and the market errors, without I/O (`io`) or the
# simulation-backed generators (`synthetic`).
market = ["dep:optionstratlib-market", "pricing"]
# `analytics`, `pnl`, `risk`, `metrics` and the analytics errors: P&L, margin,
# probability kernels, chain metrics and projections, without strategies,
# simulation or plotting.
analytics = ["dep:optionstratlib-analytics", "market"]
# `strategies` and `StrategyError`: the concrete strategies, the strategy
# traits, delta neutrality and strategy probability analysis, without
# simulation, backtesting or plotting.
strategies = ["dep:optionstratlib-strategies", "analytics"]
# `simulation` and `SimulationError`: random walks, stochastic processes,
# simulators, exit policies and path statistics, without option chains,
# strategies, backtesting or plotting. It implies only `pricing`, so
# `market`, `analytics` or `strategies` alone resolves no simulation crate.
simulation = ["dep:optionstratlib-simulation", "pricing"]
# `backtesting` and `BacktestError`: strategies evaluated over simulated
# paths, run statistics and reports, without plotting (ADR-0002 section 2).
backtest = ["dep:optionstratlib-backtest", "strategies", "simulation"]
# `synthetic`: the simulation-backed chain and series generators
# (`chains::generator_optionchain`, `series::generator_optionseries`). It
# forwards to `optionstratlib-market/synthetic`, the only market-to-simulation
# dependency (ADR-0003).
synthetic = ["market", "simulation", "optionstratlib-market/synthetic"]
# Filesystem I/O for market data: CSV, JSON and ZIP readers and writers of
# chains and OHLCV candles (ADR-0003). On by default; without it the build
# resolves no `csv` or `zip`.
io = ["market", "optionstratlib-market/io"]
# `visualization`, `GraphError` and the unified `error::Error`: chart data,
# the `Graph` contract and its implementations, without a rendering backend.
# It implies `backtest`, the layer below it (ADR-0002 section 2), and
# resolves no Plotly package.
visualization = ["dep:optionstratlib-visualization", "backtest"]
# Interactive Plotly rendering (`Graph::to_plot`, `write_html`, `show`).
plotly = ["visualization", "optionstratlib-visualization/plotly"]
# PNG / SVG export through `plotly_static`; implies `async` as in 0.21.
static_export = [
    "plotly",
    "async",
    "optionstratlib-visualization/static_export",
]
# `utoipa::ToSchema` derives on the domain types of every enabled component
# (ADR-0002 section 2, #549). Weak `crate?/schema` forwards reach only the
# components another feature already enabled, so `schema` never adds a
# component. On by default so 0.21 consumers keep their schemas; additive, it
# changes no type. `optionstratlib-visualization` has no schema feature: its
# chart models derive none.
schema = [
    "optionstratlib-core/schema",
    "optionstratlib-math?/schema",
    "optionstratlib-pricing?/schema",
    "optionstratlib-simulation?/schema",
    "optionstratlib-market?/schema",
    "optionstratlib-analytics?/schema",
    "optionstratlib-strategies?/schema",
    "optionstratlib-backtest?/schema",
]
# Reserved (ADR-0002 section 2, Option E): the name is held so it is not
# reused for another meaning, and it enables nothing. `rayon` stays mandatory
# in `math`, `pricing` and `simulation`; a sequential build needs a sequential
# twin of every parallel site, which no 0.22 issue owns.
parallel = []
# The `*_async` wrappers over the market I/O functions: `tokio` in the market
# crate and nothing in the facade itself (ADR-0002 section 2).
async = ["market", "io", "optionstratlib-market/async"]

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-math = { workspace = true, optional = true }
optionstratlib-pricing = { workspace = true, optional = true }
optionstratlib-simulation = { workspace = true, optional = true }
optionstratlib-market = { workspace = true, optional = true }
optionstratlib-analytics = { workspace = true, optional = true }
optionstratlib-strategies = { workspace = true, optional = true }
optionstratlib-backtest = { workspace = true, optional = true }
optionstratlib-visualization = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
# Only what the facade's own sources import (`prelude`, `error`): everything
# else a consumer needs comes through the component crates, so a build with
# no capability resolves no numeric, serialization or schema package
# (ADR-0002 section 3, #549).
tracing = { workspace = true }
rust_decimal = { workspace = true,  features = ["maths", "serde"] }
rust_decimal_macros = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `positive` is reached through `optionstratlib-core` in the facade's own
# sources (ADR-0001 D8); the tests and benches name it directly to prove the
# single `Positive` type.
positive = { workspace = true }
# Used by the facade's tests, property tests and doc examples; not
# dependencies of the facade itself.
rayon = { workspace = true }
expiration_date = { workspace = true }
financial_types = { workspace = true }
option_type = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
mockall = { workspace = true }
tempfile = { workspace = true }
static_assertions = "1.1"
proptest = { workspace = true }

[[test]]
name = "tests"
path = "tests/unit/mod.rs"
required-features = ["visualization"]

[[test]]
name = "property_tests"
path = "tests/property/mod.rs"
required-features = ["backtest"]

[[bench]]
name = "benches"
path = "benches/mod.rs"
harness = false
required-features = ["backtest"]

[lib]
name = "optionstratlib"
path = "src/lib.rs"
crate-type = ["rlib"]

[workspace]
# Consumer fixtures resolve on their own (ADR-0004 section 3).
exclude = [
    "fixtures/consumers/analytics-only",
    "fixtures/consumers/facade-analytics",
    "fixtures/consumers/facade-async",
    "fixtures/consumers/facade-backtest",
    "fixtures/consumers/facade-market",
    "fixtures/consumers/facade-plotly",
    "fixtures/consumers/facade-pricing",
    "fixtures/consumers/facade-schema-off",
    "fixtures/consumers/facade-simulation",
    "fixtures/consumers/facade-static-export",
    "fixtures/consumers/facade-strategies",
    "fixtures/consumers/facade-visualization",
    "fixtures/consumers/full-backtest",
    "fixtures/consumers/headless-full",
    "fixtures/consumers/market-io",
    "fixtures/consumers/market-minimal",
    "fixtures/consumers/market-synthetic",
    "fixtures/consumers/pricing-only",
    "fixtures/consumers/simulation-only",
]
members = [
    "crates/optionstratlib-core",
    "crates/optionstratlib-math",
    "crates/optionstratlib-pricing",
    "crates/optionstratlib-simulation",
    "crates/optionstratlib-market",
    "crates/optionstratlib-analytics",
    "crates/optionstratlib-strategies",
    "crates/optionstratlib-backtest",
    "crates/optionstratlib-visualization",
    "tests/workspace",
    "examples/support",
    "examples/direct/math",
    "examples/direct/pricing",
    "examples/direct/market",
    "examples/direct/analytics",
    "examples/direct/strategies",
    "examples/direct/simulation",
    "examples/direct/backtest",
    "examples/direct/visualization",
    "examples/examples_chain",
    "examples/examples_curves",
    "examples/examples_exotics",
    "examples/examples_metrics",
    "examples/examples_pricing",
    "examples/examples_simulation",
    "examples/examples_strategies",
    "examples/examples_strategies_best",
    "examples/examples_strategies_delta",
    "examples/examples_surfaces",
    "examples/examples_visualization",
    "examples/examples_volatility",
]

[workspace.package]
# Lockstep version shared by every published workspace crate (ADR-0001 D1).
version = "0.22.0"
edition = "2024"
# The minimum supported Rust version of every published crate (#559), set by
# the dependency requirements: `uuid` 1.27 and `statrs` 0.19.1 (with its
# `nalgebra` 0.35 and `wide` 1.7) declare `rust-version = "1.89"`.
# `scripts/check_package_archives.sh` checks the unpacked archives with it.
rust-version = "1.89"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/OptionStratLib"
homepage = "https://github.com/joaquinbejar/OptionStratLib"

[workspace.dependencies]
# Inter-crate dependencies: path for the workspace, version for crates.io
# (ADR-0001 D1, caret requirement on the lockstep version).
optionstratlib = { path = ".", version = "0.22.0" }
optionstratlib-core = { path = "crates/optionstratlib-core", version = "0.22.0" }
optionstratlib-math = { path = "crates/optionstratlib-math", version = "0.22.0" }
optionstratlib-pricing = { path = "crates/optionstratlib-pricing", version = "0.22.0" }
optionstratlib-simulation = { path = "crates/optionstratlib-simulation", version = "0.22.0" }
optionstratlib-market = { path = "crates/optionstratlib-market", version = "0.22.0" }
optionstratlib-analytics = { path = "crates/optionstratlib-analytics", version = "0.22.0" }
optionstratlib-strategies = { path = "crates/optionstratlib-strategies", version = "0.22.0" }
optionstratlib-backtest = { path = "crates/optionstratlib-backtest", version = "0.22.0" }
optionstratlib-visualization = { path = "crates/optionstratlib-visualization", version = "0.22.0" }
tracing = "0.1"
rust_decimal = { version = "1.43", features = ["maths", "serde"] }
rust_decimal_macros = "1.40"
# Without `static_export_default`: `optionstratlib-visualization/static_export`
# enables it, so `plotly` alone resolves no image-export or async package
# (ADR-0002 section 3).
plotly = { version = "0.14", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.10" }
statrs = "0.19"
tracing-subscriber = { version = "0.3"}
num-traits = "0.2"
serde_json = "1.0"
csv = { version = "1.4"}
serde = { version = "1.0", features = ["derive"] }
rayon = { version = "1.12" }
itertools = "0.15"
zip = "8.6"
lazy_static = "1.5"
uuid = { version = "1.27", features = ["v4", "serde"] }
approx = "0.5"
rand_distr = "0.6"
# Defaults off: nothing here uses its CSV support, and it would pull `csv`
# into every consumer. Packages that want `win_crlf` ask for it.
prettytable-rs = { version = "0.10", default-features = false }
utoipa = { version = "6.0", features = ["chrono", "decimal"] }
thiserror = "2.0"
positive = { version = "0.7" }
expiration_date = { version = "0.4.1" }
financial_types = { version = "0.3" }
option_type = { version = "0.4" }
tokio = { version = "1.53", features = ["full"] }
proptest = "1.11"
mockall = "0.15"
tempfile = "3.27"
