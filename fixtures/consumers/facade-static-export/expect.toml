# The facade with `default-features = false, features = ["static_export"]`:
# packages the resolved normal graph must contain, and packages it must not.
# `static_export` implies `plotly`, and since #927 draws PNG and SVG natively:
# Plotly plus Plotters, skrifa and ab_glyph_rasterizer. The `plotly_static`
# exporter, its WebDriver client (`fantoccini`, `webdriver`), the HTTP client
# and the font parsers Plotters' own font features would bring are absent.
# It does not imply the facade's `async` (#833), so market I/O (`csv`, `zip`)
# stays out. Checked by `make check-fixtures` (scripts/check_fixtures.py).
present = [
    "optionstratlib", "optionstratlib-visualization", "plotly", "plotters",
    "skrifa", "ab_glyph_rasterizer",
]
absent = ["plotly_static", "fantoccini", "webdriver", "reqwest", "async-trait",
    # No async runtime on the host: Plotly names `tokio` only for `wasm32`.
    "tokio", "hyper", "h2", "rustls-pemfile", "webdriver-downloader",
    "ttf-parser", "ab_glyph", "font-kit",
    "tracing-subscriber", "indicatif", "pretty-simple-display",
    "utoipa", "csv", "zip",
]
