# Consumer fixture: `optionstratlib-market` with only its `synthetic` feature
# (ADR-0002 section 5 `osl-fixture-market-synthetic`, ADR-0003, #537).
# Excluded from the root workspace so feature unification with the other
# members cannot widen its graph; built with `--manifest-path`.
[package]
name = "osl-fixture-market-synthetic"
version = "0.0.0"
edition = "2024"
publish = false
description = "Consumer fixture: simulation-backed option chains from optionstratlib-market with synthetic."
license = "MIT"

[dependencies]
# Path plus version, as every OptionStratLib dependency is declared until the
# crates are published (ADR-0001 D1).
optionstratlib-core = { path = "../../../crates/optionstratlib-core", version = "0.22.0" }
optionstratlib-market = { path = "../../../crates/optionstratlib-market", version = "0.22.0", default-features = false, features = ["synthetic"] }
optionstratlib-simulation = { path = "../../../crates/optionstratlib-simulation", version = "0.22.0" }
rust_decimal = "1.43"
rust_decimal_macros = "1.40"
