# The facade with `default-features = false, features = ["simulation"]`:
# packages the resolved normal graph must contain, and packages it must not.
# Checked by `make check-fixtures` (scripts/check_fixtures.py).
present = [
    "optionstratlib", "optionstratlib-core", "optionstratlib-math",
    "optionstratlib-pricing", "optionstratlib-simulation",
    "utoipa",
]
# `utoipa` resolves by design: the facade enables `schema` on every crate it
# names (#628 only removed it from the component crates without `schema`).
# The defining crate is also a direct dependency above, for the identity
# checks; compiling the facade paths is what proves the facade enables it.
absent = [
    "optionstratlib-market", "optionstratlib-analytics", "optionstratlib-strategies",
    "optionstratlib-backtest", "optionstratlib-visualization", "csv", "zip", "tokio",
    "reqwest", "futures", "async-trait", "plotly", "plotly_static", "fantoccini",
    "webdriver", "tracing-subscriber", "indicatif", "prettytable-rs",
    "pretty-simple-display",
]
