# The facade with its default features: packages the resolved normal graph
# must contain, and packages it must not (ADR-0002 section 5,
# `osl-fixture-headless-full`). Every capability is on, `io` brings `csv` and
# `zip`, and no rendering backend does. Checked by `make check-fixtures`
# (scripts/check_fixtures.py).
present = [
    "optionstratlib", "optionstratlib-core", "optionstratlib-math",
    "optionstratlib-pricing", "optionstratlib-simulation", "optionstratlib-market",
    "optionstratlib-analytics", "optionstratlib-strategies", "optionstratlib-backtest",
    "optionstratlib-visualization", "csv", "zip", "utoipa",
]
# `prettytable-rs` resolves by design: `visualization` is a default
# capability and its `visualization::terminal` adapter is the one owner of the
# terminal tables (M6-05, #546); no crate below it resolves the package
# (`make check-graph`). `utoipa` is present because `schema` is a default
# feature (ADR-0002 section 5).
absent = [
    "plotly", "plotly_static", "fantoccini", "webdriver", "tokio", "reqwest",
    "futures", "async-trait", "tracing-subscriber", "indicatif",
    "pretty-simple-display",
]
