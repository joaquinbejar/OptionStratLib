# The facade with `default-features = false, features = ["async"]`: packages
# the resolved normal graph must contain, and packages it must not. `async`
# implies `market` and `io`, so the CSV and ZIP readers resolve with the
# `tokio` runtime the wrappers run on, and nothing above market does.
# Checked by `make check-fixtures` (scripts/check_fixtures.py).
present = [
    "optionstratlib", "optionstratlib-core", "optionstratlib-math",
    "optionstratlib-pricing", "optionstratlib-market", "csv", "zip", "tokio",
]
absent = [
    "utoipa",
    "optionstratlib-simulation", "optionstratlib-analytics", "optionstratlib-strategies",
    "optionstratlib-backtest", "optionstratlib-visualization", "reqwest", "futures",
    "async-trait", "plotly", "plotly_static", "fantoccini", "webdriver",
    "tracing-subscriber", "indicatif", "prettytable-rs", "pretty-simple-display",
]
