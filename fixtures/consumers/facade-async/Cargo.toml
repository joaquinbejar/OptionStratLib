# Consumer fixture: the `optionstratlib` facade with only its `async`
# feature (ADR-0002 Decision 2, ADR-0003, #552): the `tokio`-backed
# `*_async` wrappers over market I/O, which `async` implies, and no
# simulation, strategy, backtest or chart crate. Excluded from the root
# workspace so feature unification with the other members cannot widen its
# graph; built with `--manifest-path`.
[package]
name = "osl-fixture-facade-async"
version = "0.0.0"
edition = "2024"
publish = false
description = "Consumer fixture: the optionstratlib facade built with the async feature alone."
license = "MIT"

[dependencies]
# Path plus version, as every OptionStratLib dependency is declared until the
# crates are published (ADR-0001 D1).
optionstratlib = { path = "../../..", version = "0.22.0", default-features = false, features = ["async"] }
# The defining crate, named directly only to prove the facade paths are the
# same items.
optionstratlib-market = { path = "../../../crates/optionstratlib-market", version = "0.22.0" }
rust_decimal = "1.43"
rust_decimal_macros = "1.40"

[dev-dependencies]
# The runtime the tests drive the wrappers on. The library brings `tokio`
# itself (`async` -> `optionstratlib-market/async`); the consumer only asks
# for the macros and the multi-threaded scheduler a service would run.
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
