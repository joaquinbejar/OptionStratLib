# Consumer fixture: a crate that analyses option positions and chains with
# core, math, pricing, market and analytics only, without the strategies
# crate or the facade (#533, ADR-0004 section 3). Excluded from the root
# workspace so feature unification with the other members cannot widen its
# graph; built with `--manifest-path`.
[package]
name = "osl-fixture-analytics-only"
version = "0.0.0"
edition = "2024"
publish = false
description = "Consumer fixture: P&L, risk, probability and chain analytics without strategies."
license = "MIT"

[features]
# `--all-features` runs the fixture with every analytics feature on; `schema`
# is the only one.
schema = ["optionstratlib-analytics/schema"]

[dependencies]
# Path plus version, as every OptionStratLib dependency is declared until the
# crates are published (ADR-0001 D1).
optionstratlib-core = { path = "../../../crates/optionstratlib-core", version = "0.22.0" }
optionstratlib-math = { path = "../../../crates/optionstratlib-math", version = "0.22.0" }
optionstratlib-pricing = { path = "../../../crates/optionstratlib-pricing", version = "0.22.0" }
optionstratlib-market = { path = "../../../crates/optionstratlib-market", version = "0.22.0" }
optionstratlib-analytics = { path = "../../../crates/optionstratlib-analytics", version = "0.22.0" }
chrono = "0.4"
rust_decimal = "1.43"
rust_decimal_macros = "1.40"
