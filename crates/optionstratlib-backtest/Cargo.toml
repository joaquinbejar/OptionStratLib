[package]
name = "optionstratlib-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Strategy backtests over simulated paths: per-path evaluation, run statistics and reports of OptionStratLib. Re-exported by the optionstratlib facade under its `backtest` feature."
readme = "README.md"
keywords = ["finance", "options", "backtesting", "simulation", "strategy"]
categories = ["finance", "mathematics", "simulation"]
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
# `ToSchema` derives on the backtest types (ADR-0002).
schema = [
    "dep:utoipa",
    "optionstratlib-core/schema",
    "optionstratlib-pricing/schema",
    "optionstratlib-simulation/schema",
    "optionstratlib-analytics/schema",
    "optionstratlib-strategies/schema",
]

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-pricing = { workspace = true }
optionstratlib-simulation = { workspace = true }
optionstratlib-analytics = { workspace = true }
optionstratlib-strategies = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "backtest"
harness = false
