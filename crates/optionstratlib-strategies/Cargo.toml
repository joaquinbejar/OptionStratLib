[package]
name = "optionstratlib-strategies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Option strategies of OptionStratLib: spreads, butterflies, condors, straddles, strangles, custom strategies, delta neutrality and strategy probability analysis. Re-exported by the optionstratlib facade under its `strategies` feature."
readme = "README.md"
keywords = ["finance", "options", "strategies", "spreads", "trading"]
categories = ["finance", "mathematics"]
include = ["/src/**/*", "/testdata/*.json", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
# `ToSchema` derives on the strategy types (ADR-0002).
schema = [
    "dep:utoipa",
    "optionstratlib-core/schema",
    "optionstratlib-pricing/schema",
    "optionstratlib-market/schema",
    "optionstratlib-analytics/schema",
]

[package.metadata.docs.rs]
# docs.rs builds the default features, empty for this crate, so name the
# optional ones the API documents. Nothing here needs a browser or the network.
features = ["schema"]

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-pricing = { workspace = true }
optionstratlib-market = { workspace = true }
optionstratlib-analytics = { workspace = true }
chrono = { workspace = true }
itertools = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
# The chain fixtures the PMCC optimiser tests and the optimisation suites
# under tests/integration read are JSON files.
optionstratlib-market = { workspace = true, features = ["io"] }
approx = { workspace = true }
proptest = { workspace = true }
static_assertions = "1.1"
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "strategies"
harness = false
