[package]
name = "optionstratlib-pricing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Option pricing models, Greeks and implied volatility of OptionStratLib, on Decimal and Positive boundaries. Re-exported by the optionstratlib facade under its `pricing` feature."
readme = "README.md"
keywords = ["finance", "options", "pricing", "greeks"]
categories = ["finance", "mathematics"]
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
# `ToSchema` derives on the pricing types (ADR-0002).
schema = ["dep:utoipa", "optionstratlib-core/schema", "optionstratlib-math/schema"]

[package.metadata.docs.rs]
# docs.rs builds the default features, empty for this crate, so name the
# optional ones the API documents. Nothing here needs a browser or the network.
features = ["schema"]

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-math = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
statrs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true }
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "pricing"
harness = false

[[bench]]
name = "greeks"
harness = false

[[bench]]
name = "volatility"
harness = false
