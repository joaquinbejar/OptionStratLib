[package]
name = "optionstratlib-market"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Option chains and option series of OptionStratLib: building, parsing, and CSV, JSON and ZIP I/O. Re-exported by the optionstratlib facade under its `market` feature."
readme = "README.md"
keywords = ["finance", "options", "option-chain", "market-data"]
categories = ["finance", "data-structures"]
include = ["/src/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
# Filesystem I/O: CSV, JSON and ZIP readers and writers (ADR-0003).
io = ["dep:csv", "dep:zip"]
# `tokio`-backed `*_async` wrappers over the `io` functions (ADR-0003).
async = ["io", "dep:tokio"]
# Simulation-backed generators: `chains::generator_optionchain` and
# `series::generator_optionseries`, and `From<SimulationError> for
# ChainError`. The only edge from market data to the simulation engine
# (ADR-0003); without it market resolves no simulation crate.
synthetic = ["dep:optionstratlib-simulation"]
# `ToSchema` derives on the market types (ADR-0002).
schema = [
    "dep:utoipa",
    "optionstratlib-core/schema",
    "optionstratlib-math/schema",
    "optionstratlib-pricing/schema",
    "optionstratlib-simulation?/schema",
]

[dependencies]
optionstratlib-core = { workspace = true }
optionstratlib-math = { workspace = true }
optionstratlib-pricing = { workspace = true }
optionstratlib-simulation = { workspace = true, optional = true }
chrono = { workspace = true }
csv = { workspace = true, optional = true }
num-traits = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
mockall = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
